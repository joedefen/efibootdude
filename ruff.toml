# Ruff configuration for efibootdude.
#
# The project keeps ruff's default rule selection. Only the two findings below
# are suppressed, and only in the file where they are deliberate, so the same
# rules still apply everywhere else.

[lint.per-file-ignores]
# main.py:
#   SIM102  -- the nested `if` in the entry-append loop separates the
#              "copies still pending" guard from the per-entry condition,
#              which keeps the loop readable.
#   BLE001  -- the top-level `__main__` handler catches every exception on
#              purpose: it must stop the curses window and print the error
#              rather than dump a traceback over the terminal.
"efibootdude/main.py" = ["SIM102", "BLE001"]
