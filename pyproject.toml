[build-system]
requires = ["flit_core>=3.4"]
build-backend = "flit_core.buildapi"

[project]
name = "efibootdude"
version = "1.1.0"
description = "A visual wrapper for efibootmgr"
authors = [
    { name = "Joe Defen", email = "joedef@duck.com" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["efi", "uefi", "efibootmgr", "boot", "bootloader", "tui", "curses"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Environment :: Console :: Curses",
    "Intended Audience :: System Administrators",
    "Topic :: System :: Boot",
    "Topic :: System :: Systems Administration"
]
dependencies = [
    # 'console-window == 1.4.3',
    'console-window == 2.0.0.7',
]

[project.optional-dependencies]
dev = [
    'pytest>=7',
]

[project.urls]
"Homepage" = "https://github.com/joedefen/efibootdude"
"Bug Tracker" = "https://github.com/joedefen/efibootdude/issues"

[project.scripts]
efibootdude = "efibootdude.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]